<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSNES lite</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#ddd;font:14px system-ui;color-scheme:dark}main{height:100dvh;min-height:0;overflow:hidden}.game{height:100dvh;display:grid;grid-template-columns:clamp(210px,26vw,232px) minmax(0,1fr) clamp(210px,26vw,232px);max-width:1400px;margin:auto;gap:2px}.pad{position:relative}.dpad{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:grid;grid-template:". up ." "left . right" ". down ."/1fr 1fr 1fr;gap:.7px}.dpad [data-button="4"]{grid-area:up;transform:translateY(15%)}.dpad [data-button="5"]{grid-area:down;transform:translateY(-15%)}.dpad [data-button="6"]{grid-area:left;transform:translateX(15%)}.dpad [data-button="7"]{grid-area:right;transform:translateX(-15%)}.touch{width:clamp(63.36px,7.92vw,77.44px);height:clamp(63.36px,7.92vw,77.44px);padding:0;border:1px solid #777;border-radius:10px;background:#292929;color:#eee;font-weight:700;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none}.touch[aria-pressed=true]{background:#666;border-color:#bbb}.system{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:12px;margin:0}.system .touch{width:36px;height:36px;border-radius:6px;font-size:11px}.tools{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:5px;width:calc(100% - 8px)}.tools input{width:100%;min-width:0;font-size:12px}.tools nav{display:flex;gap:8px}.tools nav button{padding:6px 10px;font:inherit}.status,.side-note{max-width:100%;font-size:12px;line-height:1.4;text-align:center;overflow-wrap:anywhere}.status{display:block}.actions{position:absolute;left:4px;top:50%;transform:translateY(-50%);display:flex;gap:6px}.actions .touch{width:clamp(84.48px,10.56vw,102.08px);height:clamp(84.48px,10.56vw,102.08px);border-radius:50%;font-size:20px}.right .side-note{position:absolute;left:4px;right:4px}.right .side-note:nth-child(2){top:5px}.right .side-note:nth-child(3){bottom:5px}canvas{display:block;width:min(100%,calc(100dvh * 16 / 15));height:auto;max-height:100dvh;background:#000;image-rendering:pixelated;justify-self:center;align-self:start}main:fullscreen{background:#111}@media(max-width:700px) and (orientation:portrait){main{height:auto;min-height:100dvh;overflow:auto}.game{height:auto;grid-template-columns:58% 42%;grid-template-areas:"screen screen" "left right";align-items:start;row-gap:18px}.game canvas{grid-area:screen;width:100%;height:auto}.left{grid-area:left}.right{grid-area:right}.pad{display:grid;justify-items:center;align-content:start;gap:14px}.dpad,.left .system,.left .tools,.actions,.right .side-note{position:static;transform:none}.left .system{display:grid;justify-items:center;gap:12px}.left .tools{width:100%;margin-top:4px}.actions{display:grid;justify-items:center;gap:10px}.actions .touch{width:84.48px;height:84.48px}}</style><main><section class=game aria-label="游戏画面和触控手柄"><div class="pad left"><div class=dpad aria-label="方向键"><button class=touch data-button=4 aria-label="上">▲</button><button class=touch data-button=6 aria-label="左">◀</button><button class=touch data-button=7 aria-label="右">▶</button><button class=touch data-button=5 aria-label="下">▼</button></div><div class=system><button class=touch data-button=2 aria-label="选择">Select</button><button class=touch data-button=3 aria-label="开始">Start</button></div><div class=tools><input id=rom type=file accept=.nes,.7z aria-label="选择 ROM"><nav><button id=mute aria-pressed=false>静音</button><button id=full>全屏</button></nav><output class=status id=status>选择 .nes / .7z</output></div></div><canvas id=screen width=256 height=240></canvas><div class="pad right"><div class=actions><button class=touch data-button=1 aria-label="B">B</button><button class=touch data-button=0 aria-label="A">A</button></div><div class=side-note>键盘：方向键 · Z/B · X/A · 空格/Select · Enter/Start</div><div class=side-note>支持 Mapper 0–4、30（UNROM-512）</div></div></section></main>
