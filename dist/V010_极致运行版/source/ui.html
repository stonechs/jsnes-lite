<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>JSNES lite</title><style>body{margin:0;background:#111;color:#ddd;font:14px system-ui;color-scheme:dark}main{min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:6px}nav{display:flex;align-items:center;gap:6px}input{max-width:52vw}button{font:inherit;padding:5px 10px}canvas{width:min(calc(100vw - 24px),calc((100dvh - 112px)*16/15));background:#000;image-rendering:pixelated}small,output{max-width:94vw;overflow-wrap:anywhere;text-align:center}main:fullscreen{width:100%;background:#111}</style><main><nav><input id=rom type=file accept=.nes,.7z aria-label="选择 ROM"><button id=mute aria-pressed=false>静音</button><button id=full>全屏</button></nav><canvas id=screen width=256 height=240></canvas><small>方向键移动 · Z/B X/A · 空格/Select Enter/Start · F/全屏</small><output id=status>选择 .nes / .7z</output></main>
