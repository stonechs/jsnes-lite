<!doctype html><meta charset=utf-8><title>JSNES lite standalone</title>
<h3>JSNES lite</h3><p>Mapper 0, 2, 30 (30 incomplete). Load a local .nes file.</p>
<canvas id=frameCanvas width=256 height=240></canvas>
<p><input type=file id=fileInput accept=.nes> <label><input type=checkbox id=i_start checked>Auto start</label></p>
<p><button id=b_play>Play</button> <button id=b_pause>Pause</button> <button id=b_frame>Next frame</button> <button id=b_reset>Reset</button></p>
<p>Arrow keys: move; X: A; C: B; Enter: Start; Esc: Select.</p>
<details id=p_debug><summary>VRAM</summary><canvas id=vramCanvas width=512 height=480></canvas></details>
<style>body{font:14px Arial;background:#888}canvas{background:#000;image-rendering:pixelated}</style>
<script>
var frameCanvas=document.getElementById("frameCanvas");
var vramCanvas=document.getElementById("vramCanvas");
var fileInput=document.getElementById("fileInput");
var i_start=document.getElementById("i_start");
var b_play=document.getElementById("b_play");
var b_pause=document.getElementById("b_pause");
var b_frame=document.getElementById("b_frame");
var b_reset=document.getElementById("b_reset");
// Jsnes-lite API
// ==============

// This file exposes six functions that help handle the inputs and outputs of the emulator:
// - NES.start({rom, save, frame, vram, audio})
// - NES.reset()
// - NES.frame()
// - NES.buttonDown(controller, button)
// - NES.buttonUp(controller, button)
var NES = {
  
  // Emulator globals
  loop: null,
  fps: 60,
  frameTime: 1000 / 60,
  cpu_cycles: 0,
  
  // ROM globals
  mapper: 0,
  mirroring: 0,
  prg: [],
  chr: [],
  
  // Graphics globals
  frameCtx: null,
  vramCtx: null,
  frameData: null,
  vramData: null,
  frameBuffer: null,
  vramBuffer: null,
  frameBuffer8: null,
  vramBuffer8: null,
  frameBuffer32: null,
  vramBuffer32: null,
  
  // Audio globals
  leftSamples: [],
  rightSamples: [],
  currentSample: 0,
  sampleRate: 44100,
  cyclesToHalt: 0,
  
  // Controllers globals
  controllers: null,
  
  // Mapper globals
  prg_0_bank: 0,
  prg_1_bank: 1,
  chr_bank: 0,
  mirroring_backup: 0,
  
  // Init the emulator with the rom (binary string), optional save file, and the 2 canvases
  init: ({rom, save, frame, vram}) => {

    // Reset emulator
    NES.reset();
    
    // Parse ROM
    NES.parse(rom);
    
    // Load ROM's content in memory according to current mapper
    NES.load();
    
    // Init display
    NES.frameCtx = frame.getContext("2d");
    NES.frameData = NES.frameCtx.getImageData(0, 0, 256, 240);
    NES.frameBuffer = new ArrayBuffer(256 * 240 * 4);
    NES.vramBuffer = new ArrayBuffer(512 * 480 * 4);
    NES.frameBuffer8 = new Uint8Array(NES.frameBuffer);
    NES.frameBuffer32 = new Uint32Array(NES.frameBuffer);
    if(vram){
      NES.vramCtx = vram.getContext("2d");
      NES.vramData = NES.vramCtx.getImageData(0, 0, 512, 480);
      NES.vramBuffer32 = new Uint32Array(NES.vramBuffer);
      NES.vramBuffer8 = new Uint8Array(NES.vramBuffer);
    }
    
    // Init controllers
    NES.controllers = {
      1: new Controller(),
      2: new Controller()
    };
    
    // Controller #1 keys listeners
    window.onkeydown = window.onkeyup = e => {
      (e.type === "keydown" ? NES.keydown : NES.keyup)(
        1,
        {
          37: Controller.BUTTON_LEFT,
          38: Controller.BUTTON_UP,
          39: Controller.BUTTON_RIGHT,
          40: Controller.BUTTON_DOWN,
          88: Controller.BUTTON_A, // X = A
          67: Controller.BUTTON_B, // C = B
          27: Controller.BUTTON_SELECT, // Esc = Select
          13: Controller.BUTTON_START   // Enter = Start
        }[e.keyCode]
      )
    }
  },
  
  // Play
  play: () => {
    NES.loop = setInterval(NES.frame, NES.frameTime);
  },
  
  // Pause
  pause: () => {
    clearInterval(NES.loop);
  },

  // Reset
  reset: () => {
    
    // Stop 60 fps loop (if any)
    NES.pause();
    
    // Reset CPU, PPU, APU
    cpu_reset();
    ppu_reset();
    apu_reset();
    
    // Send reset interrupt to the CPU
    interrupt_requested = 2;
    
    NES.cyclesToHalt = 0;
    
    //NES.cpu_cycles = 0;
  },

  // Render a new frame
  frame: () => {
    
    vramCanvas.width ^= 0;
    
    var cycles;
    totalCycles = 0;
    endFrame = 0;
    
    // Repeatedly execute CPU instructions until the frame is fully rendered
    while(!endFrame){
      //if (NES.cyclesToHalt === 0) {
        cycles = emulate();
      //  APU.clockFrameCounter(cycles);
      //} else {
      //  APU.clockFrameCounter(Math.min(NES.cyclesToHalt, 8));
      //  NES.cyclesToHalt -= Math.min(NES.cyclesToHalt, 8);
      //}

      for (i = cycles; i--;) {
        cpu_tick();
      }
    }
  },
  
  keydown: (controller, button) => {
    NES.controllers[controller].keydown(button);
  },

  keyup: (controller, button) => {
    NES.controllers[controller].keyup(button);
  },
  
  //haltCycles: (cycles) => {
  //  NES.cyclesToHalt += cycles;
  //}
}
;
// ROM loader
// ==========

// This file exposes one function: parse_rom(data)
// It parses a ROM file (iNES 1.0) and sets up the ROM banks and various emulator options.

// iNes ROM file header (16 bytes):

// +------+-----------------------------------------------------------------------------------------+
// | Byte | Use                                                                                     |
// +------+-----------------------------------------------------------------------------------------+
// | 0-3  | $4E $45 $53 $1A (ASCII chars "NES<EOF>")                                                |
// +------+-----------------------------------------------------------------------------------------+
// | 4    | Number of 16KB PRG-ROM banks                                                            |
// | 5    | Number of 8KB CHR-ROM banks (if 0 => use 1 CHR-RAM bank)                                |
// +------+-----------------------------------------------------------------------------------------+
// | 6    | - bit 0: Nametable mirroring (0 => horizontal / 1 => vertical)                          |
// |      | - bit 1: Cartridge contains battery-backed PRG-RAM (CPU $6000-$7FFF)                    |
// |      | - bit 2: Cartridge contains a 512B trainer (CPU $7000-$71FF)                            |
// |      | - bit 3: Ignore mirroring in bit 0, use 4-screen nametable instead                      |
// |      | - bits 4-7: Bits 0-3 of mapper number                                                   |
// +------+-----------------------------------------------------------------------------------------+
// | 7    | - bit 0: Vs. arcade system                                                              |
// |      | - bit 1: extra 8KB ROM bank for arcade systems                                          |
// |      | - bits 2-3: If bit 3 = 1 and bit 2 = 0: iNES 2.0. Else: iNES 1.0. (Unreliable)          |
// |      | - bits 4-7: Bits 4-7 of mapper number                                                   |
// +------+-----------------------------------------------------------------------------------------+
// | 8    | - iNES 1.0: Number of 8KB PRG-RAM banks (if 0 => add 1 bank for better compatibility)   |
// |      | - iNES 2.0: Submapper (bits 0-4), bits 8-11 of mapper number (bits 5-8)                 |
// +------+-----------------------------------------------------------------------------------------+
// | 9    | - iNES 1.0: TV system (0: NTSC / 1: PAL). (Unreliable)                                  |
// |      | - iNES 2.0: bits 8-11 of CHR-ROM size (bits 0-3), bits 8-11 of PRG-ROM size (bits 4-7)  |
// +------+-----------------------------------------------------------------------------------------+
// | 10   | iNES 2.0: PRG-RAM NOT battery-backed (bits 0-3) and battery-backed (bits 4-7)           |
// | 11   | iNES 2.0: CHR-RAM NOT battery-backed (bits 0-3) and battery-backed (bits 4-7)           |
// |      | (values follow a logarithmic scale. 0: 0 byte / 1-14: 128 * 2^N bytes / 15: reserved)   |
// +------+-----------------------------------------------------------------------------------------+
// | 12   | iNES 2.0: Bit 0: NTSC / PAL Bit 1: both. (Unreliable)                                   |
// +------+-----------------------------------------------------------------------------------------+
// | 13   | iNES 2.0: Vs. arcade system configuration: PPU mode (bits 0-4), Vs. mode (bits 4-7)     |
// +------+-----------------------------------------------------------------------------------------+
// | 14   | iNES 2.0: amount of extra ROM banks (bits 0-1)                                          |
// +------+-----------------------------------------------------------------------------------------+
// | 15   | $00 (Reserved)                                                                          |
// +------+-----------------------------------------------------------------------------------------+

// ROM file contents, after the header:
// ------------------------------------
// - Trainer, if present (0 or 512 bytes)
// - PRG-ROM banks (16384 * x bytes)
// - CHR-ROM banks (8192 * y bytes, a bank contains two 4KB pages)
// - Extra ROM banks, if present (arcade games only)

// Banks not present in the ROM file:
// ----------------------------------
// - PRG-RAM banks (save slot) - emulators usually use a save file to simulate this
// - CHR-RAM banks (same as CHR-ROM, readable & writeable) - this is filled directly by the CPU

// How to detect the iNES format version (ignored here):
// -----------------------------------------------------
// - If (byte 7 AND $0C) == $08, and the size encoded in bytes 4, 5 and 9 does not exceed the file size, then iNES 2.0
// - Else if (byte 7 AND $0C) == $00, and bytes 12-15 are 0, then iNES 1.0
// - Else, archaic iNES format

// How to detect the TV system (when it's absent or wrong in the header):
// ----------------------------------------------------------------------
// - The ROM banks' checksums can be searched in a NES games database like NesCartDB (http://bootgod.dyndns.org:7777)
// - The filename can contain "(E)", "(EUR)" or "(Europe)" for PAL / "(U)", "(USA)", "(J)" or "(Japan)" for NTSC / "(EU)" or "(World)" for both
// - You can also fallback to NTSC if you don't know (if the game is PAL, it will still work, but it'll run 20% faster)

// Parse a ROM file:
NES.parse = (data, i, j, offset) => {

  // Ensure file starts with chars "NES\x1a"
  if(data[0] + data[1] + data[2] + data[3] == 256){
  
    // Read useful information from the rom header:
    
    // Check if the game adds 2 extra KB to the PPU's VRAM to have a 4-screen nametable (byte 6, bit 3)
    // Otherwise, read mirroring layout (byte 6, bit 0)
    // 0 => vertical mirroring (bit 0 on: the game can scroll horizontally)
    // 1 => horizontal mirroring (bit 0 off: the game can scroll vertically)
    // 2 => 4-screen nametable (bit 4 on: the game can scroll horizontally and vertically)
    // 3 => 1-screen mirroring (can be enabled by some mappers but can't be set in the iNES header)
    NES.mirroring = (data[6] & 0b00001000) ? 2 : (data[6] & 0b0000001) ? 0 : 1;
    
    // Check if the game has at least one battery-backed PRG-RAM bank (byte 6, bit 1)
    // This is a persistent save slot that can be used to save the player's progress in a game
    // If present, it can be accessed by the CPU at the addresses $6000-$7FFF (ignored for now)
    // batteryRam = (data.charCodeAt(6) & 0b0000010);
    
    // Mapper number (byte 6, bits 4-7 >> 4 + byte 7, bits 4-7)
    // iNes 2.0 ROMs contain more mapper bits on byte 8
    NES.mapper = (data[6] >> 4) + (data[7] & 0b11110000);
    
    // Skip header
    offset = 16;
    
    // Skip 512b trainer, if it's present (byte 6, bit 2)
    // This ROM bank is only used by special hardware or rom hacks, so it can be ignored
    // (if present, it's usually mapped to the memory addresses $7000-$71FF)
    if(data[6] & 0b00000100) offset += 512;
    
    // Load the PRG-ROM banks containing the game's code
    // The number of 16KB PRG-ROM banks is stored on byte 4 of the header
    NES.prg = [];
    for(i = 0; i < data[4]; i++){
      NES.prg[i] = [];
      for(j = 0; j < 16 * 1024; j++){
        NES.prg[i][j] = data[offset++];
      }
    }
    
    // Load the CHR-ROM banks
    // The number of 8KB CHR-ROM banks is stored on byte 5 of the header
    // Each bank contains 2 banks of 256 8*8px, 4-color bitmap tiles
    // If only one bank is present, it is mirrored (ignored here, no game seems to actually do that)
    NES.chr = [[]];
    for(i = 0; i < data[5]; i++){
      NES.chr[i] = [];
      for(j = 0; j < 8 * 1024; j++){
        NES.chr[i][j] = data[offset++];
      }
    }
  }
}
;
// CPU
// ===

// Resources:
// - https://wiki.nesdev.com/w/index.php/CPU_unofficial_opcodes
// - https://wiki.nesdev.com/w/index.php/Status_flags
// - http://wiki.nesdev.com/w/index.php/CPU_interrupts
// - https://wiki.nesdev.com/w/index.php/Stack
// - https://www.masswerk.at/6502/6502_instruction_set.html
// - https://problemkaputt.de/everynes.htm#cpu65xxmicroprocessor
// - https://www.npmjs.com/package/dict-tempering
// - http://www.6502.org/tutorials/vflag.html
// - https://retrocomputing.stackexchange.com/questions/145
// - http://forum.6502.org/viewtopic.php?f=8&t=6370

var
cpu_mem,
interrupt_requested,
clk = 0,

// Reset the CPU
cpu_reset = () => {
    
  // CPU internal memory (64KB)
  cpu_mem = [];
},

// Clock 1 CPU cycle
// During this time, 3 PPU cycles and 1 APU cycle take place
cpu_tick = () => {
  //console.log(clk++);
  ppu_tick();
  ppu_tick();
  ppu_tick();
  //apu_tick();
},

// Emulates a single CPU instruction or interrupt, returns the number of cycles
emulate = () => {

  // Execute the requested interrupt, if any
  if(interrupt_requested){
    
    // 1: NMI
    // 2: Reset
    // 3: IRQ
    op(interrupt_requested);
    
    // Reset interrupt requested flag
    interrupt_requested = 0;
  }

  // Or execute next instruction
  else {
    op();
  }
  
  // Return the number of cycles spent
  return c;
}
;
// Memory manager
// ==============

// This file handles the CPU's memory accesses
// It assumes that the memory has been initialized (see CPU_reset())
// Reading and writing at specific addresses makes the CPU able to communicate with other parts of the emulator (PPU, APU, controllers, mapper)

// Resources:
// - https://problemkaputt.de/everynes.htm#memorymaps
// - https://problemkaputt.de/everynes.htm#iomap
// - https://wiki.nesdev.com/w/index.php/cpu_memory_map

//  CPU memory map (64KB):

//  +-------------+-------+-------------------------------------------------------+
//  | Address     | Size  | Use                                                   |
//  +-------------+-------+-------------------------------------------------------+
//  | $0000-$07FF | 2KB   | 2KB internal RAM:                                     |
//  | $0000-$00FF | 256B  | - Zero page                                           |
//  | $0100-$01FF | 256B  | - Stack                                               |
//  | $0200-$07FF | 1.5KB | - General purpose                                     |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | $0800-$0FFF | 2KB   | Mirror of $0000-$07FF                                 |
//  | $1000-$17FF | 2KB   | Mirror of $0000-$07FF                                 |
//  | $1800-$1FFF | 2KB   | Mirror of $0000-$07FF                                 |
//  +-------------+-------+-------------------------------------------------------+
//  | $2000-$2007 | 8B    | PPU I/O registers:                                    |
//  | 2000        | 1B    | PPU Control Register 1                   (Write-only) |
//  | 2001        | 1B    | PPU Control Register 2                   (Write-only) |
//  | 2002        | 1B    | PPU Status Register                       (Read-only) |
//  | 2003        | 1B    | SPR-RAM Address Register                 (Write-only) |
//  | 2004        | 1B    | SPR-RAM Data Register                    (Read/write) |
//  | 2005        | 1B    | PPU Background Scrolling Offset   (Write-only, twice) |
//  | 2006        | 1B    | VRAM Address Register             (Write-only, twice) |
//  | 2007        | 1B    | VRAM Read/Write Data Register            (Read/write) |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | $2008-$3FFF | 8184B | Mirrors of $2000-$2007 (every 8 bytes)                |
//  +-------------+-------+-------------------------------------------------------+
//  | $4000-$4017 | 24B   | APU I/O registers:                                    |
//  | 4000        | 1B    | APU Channel 1 (Rectangle) Volume/Decay        (Write) |
//  | 4001        | 1B    | APU Channel 1 (Rectangle) Sweep               (Write) |
//  | 4002        | 1B    | APU Channel 1 (Rectangle) Frequency           (Write) |
//  | 4003        | 1B    | APU Channel 1 (Rectangle) Length              (Write) |
//  | 4004        | 1B    | APU Channel 2 (Rectangle) Volume/Decay        (Write) |
//  | 4005        | 1B    | APU Channel 2 (Rectangle) Sweep               (Write) |
//  | 4006        | 1B    | APU Channel 2 (Rectangle) Frequency           (Write) |
//  | 4007        | 1B    | APU Channel 2 (Rectangle) Length              (Write) |
//  | 4008        | 1B    | APU Channel 3 (Triangle) Linear Counter       (Write) |
//  | 4009        | 1B    | N/A                                                   |
//  | 400A        | 1B    | APU Channel 3 (Triangle) Frequency            (Write) |
//  | 400B        | 1B    | APU Channel 3 (Triangle) Length               (Write) |
//  | 400C        | 1B    | APU Channel 4 (Noise) Volume/Decay            (Write) |
//  | 400D        | 1B    | N/A                                                   |
//  | 400E        | 1B    | APU Channel 4 (Noise) Frequency               (Write) |
//  | 400F        | 1B    | APU Channel 4 (Noise) Length                  (Write) |
//  | 4010        | 1B    | APU Channel 5 (DMC) Play mode & DMA frequency (Write) |
//  | 4011        | 1B    | APU Channel 5 (DMC) Delta counter load        (Write) |
//  | 4012        | 1B    | APU Channel 5 (DMC) Address load              (Write) |
//  | 4013        | 1B    | APU Channel 5 (DMC) Length                    (Write) |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | 4014        | 1B    | SPR-RAM DMA Register                          (Write) |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | 4015        | 1B    | DMC/IRQ/length status/channel enable     (Read/write) |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | 4016        | 1B    | Joypad #1                                (Read/write) |
//  | 4017        | 1B    | Joypad #2 / APU SOFTCLK                  (Read/write) |
//  +- - - - - - -+- - - -+- - - - - - - - - - - - - - - - - - - - - - - - - - - -+
//  | $4018-$401F | 8B    | APU I/O test registers (disabled)                     |
//  +-------------+-------+-------------------------------------------------------+
//  | $4020-$FFFF | 48KB  | Cartridge space:                                      |
//  | $4020-$5FFF | 8160B | - Expansion ROM (some mappers add extra ROM/RAM here) |
//  | $6000-$7FFF | 8KB   | - PRG-RAM (if any)                                    |
//  | $7000-$71FF | 512B  | - trainer (if any)                                    |
//  | $8000-$BFFF | 16KB  | - PRG-ROM low page                                    |
//  | $C000-$FFFF | 16KB  | - PRG-ROM high page, including:                       |
//  | $FFFA-$FFFB | 2B    |   * NMI vector                                        |
//  | $FFFC-$FFFD | 2B    |   * Reset vector                                      |
//  | $FFFE-$FFFF | 2B    |   * IRQ/BRK vector                                    |
//  +-------------+-------+-------------------------------------------------------+


// Read a 8-byte value in memory
memory_read = address => {
  
  // Wrap around ($0000-$FFFF)
  address &= 0xFFFF;
  
  // Handle RAM mirrors ($0000-$07FF + $0800-$1FFF)
  if(address < 0x2000) address &= 0x7FF;
  
  // PPU registers ($2000-$2007) + mirrors ($2008-$3FFF)
  else if(address < 0x4000){
    
    // Mirroring
    address &= 0x2007;

    // $2002: PPU Status Register
    if(address == 0x2002) return get_PPUSTATUS(); 

    // $2004: Sprite Memory read
    else if(address == 0x2004) return get_OAMDATA(); 
    
    // $2007: VRAM read
    else if(address == 0x2007) return get_PPUDATA(); 
  }
  
  // Sound and I/O registers ($4000-$401F)
  else if(address < 0x4020){
    
    // $4015: Sound channel enable, DMC Status
    if(address == 0x4015){
      return get_4015();
    }

    // $4016: Joystick 1 + Strobe
    else if(address == 0x4016) return joy1Read();

    // $4017: Joystick 2 + Strobe
    else if(address == 0x4017) return joy2Read();
  }
  
  // PRG-ROM
  else if(address >= 0x8000 && address < 0xC000){
    return NES.prg[NES.prg_0_bank][address - 0x8000];
  }
  else if(address >= 0xC000){
    return NES.prg[NES.prg_1_bank][address - 0xC000];
  }
  
  // Simply read in memory
  return cpu_mem[address] || 0;
},

// Write a 8-bit value in memory
memory_write = (address, value) => {
  
  // Wrap around ($0000-$FFFF)
  address &= 0xFFFF;
  
  // Handle RAM mirrors ($0000-$07FF + $0800-$1FFF)
  if(address < 0x2000) address &= 0x7FF;
  
  // PPU registers ($2000-$2007) + mirrors ($2008-$3FFF)
  else if(address < 0x4000){
    
    address &= 0x2007;
    
    // $2000: PPU Control register 1 (write-only)
    if(address == 0x2000) set_PPUCTRL(value);

    // $2001: PPU Control register 2 (write-only)
    else if(address == 0x2001) set_PPUMASK(value);

    // $2003: Set Sprite RAM address (write-only)
    else if(address == 0x2003) set_OAMADDR(value);

    // $2004: Write to Sprite RAM
    else if(address == 0x2004) set_OAMDATA(value);

    // $2005: Screen Scroll offsets (write-only)
    else if(address == 0x2005) set_PPUSCROLL(value);

    // $2006: Set VRAM address (write-only)
    else if(address == 0x2006) set_PPUADDR(value);

    // $2007: Write to VRAM
    else if(address == 0x2007) set_PPUDATA(value);
  }
  
  // APU registers ($4000-$4013)
  else if(address < 0x4014) {
    //APU.storeRegister(address, value);
    //APU.writeReg(address, value);

    if(address == 0x4000) set_4000(value);
    if(address == 0x4001) set_4001(value);
    if(address == 0x4002) set_4002(value);
    if(address == 0x4003) set_4003(value);
    
    if(address == 0x4004) set_4004(value);
    if(address == 0x4005) set_4005(value);
    if(address == 0x4006) set_4006(value);
    if(address == 0x4007) set_4007(value);
    
    if(address == 0x4008) set_4008(value);
    if(address == 0x400a) set_400a(value);
    if(address == 0x400b) set_400b(value);
    
    if(address == 0x400c) set_400c(value);
    if(address == 0x400e) set_400e(value);
    if(address == 0x400f) set_400f(value);
    
    /*
    if(address == 0x4010) set_4010(value);
    if(address == 0x4011) set_4011(value);
    if(address == 0x4012) set_4012(value);
    if(address == 0x4013) set_4013(value);*/
  }
  
  // I/O registers ($4014-$401F)
  else if(address < 0x4020){
    
    // $4014: Sprite Memory DMA Access
    if(address == 0x4014) set_OAMDMA(value);

    // $4015: Sound Channel Switch, DMC Status
    else if(address == 0x4015) {
      set_4015(value);
    }

    // $4016: Joystick 1 + Strobe
    else if(address == 0x4016){
      if((value & 1) === 0 && (joypadLastWrite & 1) === 1){
        joy1StrobeState = 0;
        joy2StrobeState = 0;
      }
      joypadLastWrite = value;
    }

    // $4017: Sound channel frame sequencer:
    else if(address == 0x4017){
      set_4017(value);
    }
  }

  // Write to persistent RAM (save slot)
  else if(address >= 0x6000 && address < 0x8000) NES.onBatteryRamWrite(address, value);
  
  // Simply write in memory, if not in PRG-ROM (necessary?)
  if(address < 0x8000){
    cpu_mem[address] = value;
  }
  
  // Inform the Mapper that a write has been made in memory
  mapper_write(address, value);
}
;
// Mappers
// =======

// Resources:

// Load ROM's content in memory
NES.load = () => {
  
  // Mapper 0
  // --------
  // https://wiki.nesdev.com/w/index.php/NROM
  // - 2 x 16KB PRG-ROM banks (mirrored if less than 32KB)
  // - 1 x 8KB CHR-ROM  bank (mirrored if less than 8KB) or 1 x 8KB CHR-RAM bank
  // - Horizontal or vertical nametable mirroring (fixed)
  if(!NES.mapper){
    
    // Set PRG-ROM banks: 0 and the last one (fixed):
    NES.prg_0_bank = 0;
    NES.prg_1_bank = NES.prg.length - 1;

    // Set CHR-ROM/RAM bank: 0 (fixed)
    NES.chr_bank = 0;
  }
  
  // Mapper 2
  // --------
  // https://wiki.nesdev.com/w/index.php/NROM
  // - 8 or 16 x 16KB PRG-ROM banks
  // - 1 x 8KB CHR-ROM bank
  // - Horizontal or vertical nametable mirroring (fixed)
  else if(NES.mapper == 2){
    
    // Set PRG-ROM banks: 0 (swappable) and the last one (fixed)
    NES.prg_0_bank = 0;
    NES.prg_1_bank = NES.prg.length - 1;
    
    // Set CHR-RAM bank: 0 (fixed)
    NES.chr_bank = 0;
  }
  
  // Mapper 30 (incomplete)
  // ----------------------
  // https://www.nesdev.org/wiki/UNROM_512
  // - 16 or 32 x 16KB PRG-ROM banks
  // - 4 x 8KB CHR-RAM banks
  // - Horizontal / vertical mirroring (fixed) or 1-screen mirroring (programmable)
  else if(NES.mapper == 30){
    
    // Initialize the 4 x 8KB CHR-RAM banks (empty on boot)
    NES.chr = [[], [], [], []];
    
    // Set PRG-ROM banks: 0 (swappable) and the last one (fixed)
    NES.prg_0_bank = 0;
    NES.prg_1_bank = NES.prg.length - 1;
    
    // Set CHR-RAM bank (fixed):
    NES.chr_bank = 0;
    
    // Backup mirroring
    NES.mirroring_backup = NES.mirroring;
  }
  else {
    alert("unknown mapper: " + NES.mapper);
  }
},

// Some mappers do special things when some addresses are written in CPU memory. This is handled here:
mapper_write = (address, value) => {
  
  // Mapper 0:
  // ---------
  // nothing
  
  // Mapper 2:
  // ---------
  // - Write [MCCP PPPP] in any address between $C000 and $FFFF to set M (1-screen mirroring), CC (CHR-RAM bank swap), PPPPP (low PRG-ROM bank swap: $8000-$BFFF).
  // - TODO: Erase 4KB of PRG-ROM (code must be in wram): $C000:$01, $9555:$AA, $C000:$00, $AAAA:$55, $C000:$01, $9555:$80, $C000:$01, $9555:$AA, $C000:$00, $AAAA:$55, $C000:BANK (BANK = $00-$1F), ADDR:$30 (ADDR = $8000/9000/$A000/$B000). Read ADDR twice until DATA is correct twice.
  // - TODO: Write 1B of PRG-ROM (code must be in wram): $C000:$01, $9555:$AA, $C000:$00, $AAAA:$55, $C000:$01, $9555:$A0, $C000:BANK, ADDR:DATA (DATA = $00-$FF). Read ADDR twice until DATA is correct twice.
  // - Other routines (ignored here): chip-erase, Software ID entry and Software ID exit.
  if(NES.mapper == 30){
    if(address >= 0xC000){
      NES.prg_0_bank = value & 0x11111;
      NES.chr_bank = (value >> 5) & 0b11;
      NES.mirroring = (value >> 7) ? 3 : NES.mirroring_backup;
    }
  }
  
  // Mapper 30:
  // ----------
  // - Write [xxxx PPPP] in any address between $8000 and $FFFF to set PPPP (low PRG-ROM bank swap: $8000-$BFFF).
  if(NES.mapper == 2){
    if(address >= 0x8000){
      NES.prg_0_bank = value & 0x1111;
    }
  }
}

var Controller = function(){
  this.state = new Array(8);
  for(var i = 0; i < this.state.length; i++){
    this.state[i] = 0x40;
  }
};

joy1StrobeState = 0
joy2StrobeState = 0

Controller.BUTTON_A = 0;
Controller.BUTTON_B = 1;
Controller.BUTTON_SELECT = 2;
Controller.BUTTON_START = 3;
Controller.BUTTON_UP = 4;
Controller.BUTTON_DOWN = 5;
Controller.BUTTON_LEFT = 6;
Controller.BUTTON_RIGHT = 7;

Controller.prototype = {
  keydown: function(key){
    this.state[key] = 0x41;
  },

  keyup: function(key){
    this.state[key] = 0x40;
  }
};


joy1Read = function(){
  var ret;

  switch (joy1StrobeState){
    case 0:
    case 1:
    case 2:
    case 3:
    case 4:
    case 5:
    case 6:
    case 7:
      ret = NES.controllers[1].state[joy1StrobeState];
      break;
    case 8:
    case 9:
    case 10:
    case 11:
    case 12:
    case 13:
    case 14:
    case 15:
    case 16:
    case 17:
    case 18:
      ret = 0;
      break;
    case 19:
      ret = 1;
      break;
    default:
      ret = 0;
  }

  joy1StrobeState++;
  if(joy1StrobeState === 24){
    joy1StrobeState = 0;
  }

  return ret;
},

joy2Read = function(){
  var ret;

  switch (joy2StrobeState){
    case 0:
    case 1:
    case 2:
    case 3:
    case 4:
    case 5:
    case 6:
    case 7:
      ret = NES.controllers[2].state[joy2StrobeState];
      break;
    case 8:
    case 9:
    case 10:
    case 11:
    case 12:
    case 13:
    case 14:
    case 15:
    case 16:
    case 17:
    case 18:
      ret = 0;
      break;
    case 19:
      ret = 1;
      break;
    default:
      ret = 0;
  }

  joy2StrobeState++;
  if(joy2StrobeState === 24){
    joy2StrobeState = 0;
  }

  return ret;
}

// mini 6502 CPU simulator
// =======================

// Globals
// -------

// Registers
A =           // accumulator
X =           // X
Y =           // Y
S = 0,        // stack pointer (also called SP)
PC = 0x8000,  // program counter (address of next instruction)
P = 0x24,     // status register (flags on bytes 0-7: C=0, Z=0, I=1, D=0, B=0, 1, V=0, N=0)

// Other globals
t =          // temp var
o =          // opcode value
a =          // operand address
p =          // operand value
c = 0,       // cycle counter

// Helpers
// -------

// Read/write a byte in memory. Costs 1 cycle
// These functions handle mirrors, persistent save slots, and Mapper-specific features like bank switches
r = v => (c++, memory_read(v)),
w = (v, w) => (c++, memory_write(v, w)),

// Update N and Z status flags:
// - The value v is clamped on 8 bits and returned
// - The Zero flag (bit 1 of P) is set if v is zero, otherwise it's cleared
// - The Negative flag (bit 7 of P) is set if byte 7 of v is 1, otherwise it's cleared
F = v => (
  Z = (v &= 255) < 1,
  N = v >> 7,
  v
),

// Update the flags values according to the status register P
f = v => (
  C = v & 1,
  Z = (v>>1) & 1,
  I = (v>>2) & 1,
  D = (v>>3) & 1,
  B = (v>>4) & 1,
  V = (v>>6) & 1,
  N = v>>7
),

// Set all flags on load
f(P = 0x24),

// Push on Stack
// Write at address $100 + S, decrement S, wrap it between $00 and $FF
h = v => (
  w(256 + S--, v),
  S &= 255
),

// Pull from stack
// Increment S, wrap it between $00 and $FF, read at address $100 + S
g = v => r(256 + (S = (255 & (S+1)))),

// Instructions
// ============

// The code below creates a function for each valid opcode supported by the CPU.
// When a function is called:
// - PC represents the current opcode's address
// - o is the opcode's value
// - a equals PC+1
// - p is the value stored at the address PC+1
// - c (the cycle counter) equals 2 because two memory reads have already been done (o and p)
O = [...Array(255)].map((t,o) =>
  Function(

    (

      // Addressing modes
      // ----------------

      // Some opcodes require an address in memory
      // This address can be computed in 11 different ways
      // The 10 main ones are implemented here, the 11th is included in the last instruction (JMP ind)
      // The order and implementations below are optimized for a better gzip compression

      // "0": Immediate:
      // The target address is PC+1, already stored in a
      // Opcode size: 2 bytes
      // Cycles total: 2
      // Cycles addr.: -1 (1 cycle is removed because the first p fetch is redundant, the instruction has to read it again)
      // Cycles opc. : 1
      "c--,PC++;"

      // "1": Relative:
      // (only used for branching)
      // The target address (between PC-128 and PC+127) = PC + signed offset stored in p
      // Opcode size: 2 bytes
      // Cycles total: 2 (no branch) / 3 (branch on same page) / 4 (branch on another page)
      // Cycles addr.: 0
      // Cycles opc. : 0-2
      + "a=a+p-256*(p>>7),PC++;"

      // "2": Indexed indirect X
      // The target address is absolute and stored at a zero page address which is stored at PC + 1 + X
      // Opcode size: 2 bytes
      // Cycles total: 6 (read or write)
      // Cycles addr.: 3
      // Cycles opc. : 1
      + "a=r(p+X&255)+256*r(p+X+1&255),PC++,c++;"

      // "3": Indirect indexed Y
      // The target address is absolute and stored at a zero page address which is stored at PC+1, then Y is added to it
      // Opcode size: 2 bytes
      // Cycles total: 5* (read) / 6 (write)
      // Cycles addr.: 2-3
      // Cycles opc. : 0-1
      // * Cross-page read (if address and address + Y are on different pages) costs 1 extra cycle
      + "a=r(p)+256*r(p+1&255)+Y,c+=a-Y>>8<a>>8||o>>4==9,PC++;"

      // "4": Zero page X
      // The target address is equal to zero page address (stored at PC+1) + X, wrapping between $00 and $FF
      // Opcode size: 2 bytes
      // Cycles total: 3 (BIT) / 4 (read or write) / 6 (read + write)
      // Cycles addr.: 1
      // Cycles opc. : 0-2
      + "a=r(a)+X&255,PC++;"

      // "5": Zero page Y
      // The target address is equal to zero page address (stored at PC+1) + Y, wrapping between $00 and $FF
      // Opcode size: 2 bytes
      // Cycles total: 4 (read or write)
      // Cycles addr.: 1
      // Cycles opc. : 1
      + "a=r(a)+Y&255,PC++;"

      // "6": Zero page
      // The target address (between $00 and $FF) is stored in p
      // Opcode size: 2 bytes
      // Cycles total: 3 (read or write) / 5 (read + write)
      // Cycles addr.: 0
      // Cycles opc. : 1-3
      + "a=p,PC++;"

      // "7": Absolute
      // The target address is stored at PC+1 (low byte) and PC+2 (high byte)
      // Opcode size: 3 bytes
      // Cycles total: 3 (JMP) / 4 (read or write) / 6 (read + write or JSR)
      // Cycles addr.: 1
      // Cycles opc. : 0-3
      + "a=p+256*r(PC+=2);"

      // "8": Absolute Y
      // The target address is equal to absolute address (stored at PC+1 and PC+2) + Y
      // Opcode size: 3 bytes
      // Cycles total: 4* (read) / 5 (write)
      // Cycles addr.: 1-2
      // Cycles opc. : 0-2
      // * Cross-page read (if address and address + Y are on different pages) costs 1 extra cycle
      + "t=p+256*r(PC+=2),c+=t>>8<t+Y>>8||o>>4==9,a=t+Y;"

      // "9": Absolute X
      // The target address is equal to absolute address (stored at PC+1 and PC+2) + X
      // Opcode size: 3 bytes
      // Cycles total: 4* (read) / 5 (write) / 7 (read + write)
      // Cycles addr.: 1-2
      // Cycles opc. : 0-4
      // * Cross-page read (if address and address + X are on different pages) costs 1 extra cycle
      + "t=p+256*r(PC+=2),c+=t>>8<t+X>>8||o>>4==9||(15&o)>13,a=t+X"

      // "Z": implicit or Accumulator
      // The target is either a flag or a CPU register (no need to compute an address)
      // (When a "Z" is read, the generated JavaScript code will just contain "undefined;")
      // Opcode size: 1 byte (no need to increment PC)
      // Cycles total: 2-7
      // Cycles addr.: 0
      // Cycles opc. : 0-5
      + ""

    // Make an array from this string
    ).split(";")

    // Fetch the right addressing mode for the current opcode (ignore illegal opcode where o % 4 == 3):
    // (The string below is optomized for compression: the illegal opcodes are assigned characters that create extra repetitions)
    [
      (
         "020666Z0Z77713Z444Z8Z999"
        +"720666Z0Z77713Z444Z8Z999"
        +"Z20666Z0Z77713Z444Z8Z999"
        +"Z20666Z0Z77713Z444Z8Z999"
        +"020666Z0Z77713Z445Z8Z998"
        +"020666Z0Z77713Z445Z8Z998"
        +"020666Z0Z77713Z444Z8Z999"
        +"020666Z0Z77713Z444Z8Z999"
      )[o-(o>>2)]
    ]

    // Separator
    + ";"

    // Instructions
    // ------------

    // There are 56 official instructions, performing operations in memory and/or in the registers
    // Some instructions use extra cycles:
    // *  : cross-page when fetching the address costs 1 extra cycle
    // ** : Same-page branch (PC+2>>8 == a>>8) costs 1 extra cycle. Cross-page branch costs 2 extra cycles
    // ***: Instructions that read, modify and write a value in memory (+ JSR/RTI/RTS/PLA/PLP) cost 1 to 2 extra cycles
    // The order and implementations below are also optimized for a better gzip compression
    // Also, some instructions were splitted in two if they target either the memory or the Accumulator register (ROR, ROL, LSR, ASL)

    + (
    
      // " ": TXS (transfer X to stack pointer)
      // Stack pointer = X
      // Addressing:   imp
      // Opcode:       9A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      "S=X;"
      
      // "!": CPX (compare memory and X)
      // N, Z and C are set with the result of X minus a byte in memory
      // Flag C is set if there's no borrow
      // Addressings:  imm, zpg, abs
      // Opcodes:      E0,  E4,  EC
      // Cycles total: 2,   3,   4
      // Cycles addr.: -1,  0,   1
      // Cycles opc. : 1,   1,   1
      + "p=r(a),C=X-p>=0,F(X-p);"

      // '"': CPY (compare memory and Y)
      // N, Z and C are set with the result of Y minus a byte in memory
      // Flag C is set if there's no borrow
      // Addressings:  imm, zpg, abs
      // Opcodes:      C0,  C4,  CC
      // Cycles total: 2,   3,   4
      // Cycles addr.: -1,  0,   1
      // Cycles opc. : 1,   1,   1
      + "p=r(a),C=Y-p>=0,F(Y-p);"

      // "#": ASL (shift left)
      // A byte in memory is left shifted. Flags: N, Z, C
      // The shifted-out bit 7 is saved in C
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      06,  16,   0E,  1E
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "p=r(a),C=p>>7,w(a,F(2*p)),c++;"

      // "$": ROL A (rotate left accumulator)
      // Rotate left A. Same as left shift but C flag is put into bit 0. Flags: N, Z, C
      // The shifted-out bit 7 is saved in C
      // Addressing:   A
      // Opcode:       2A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=A>>7,A=F(2*A+(1&P));"

      // "%": ROL (rotate left)
      // Rotate left a byte in memory. Same as left shift but C flag is put into bit 0. Flags: N, Z, C
      // The shifted-out bit 7 is saved in C
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      26,  36,   2E,  3E
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "p=r(a),C=p>>7,w(a,F(2*p+(1&P))),c++;"

      // "&": LSR A (shift right accumulator)
      // A is shifted right. Flags: N, Z, C
      // The shifted-out bit 0 is saved in C
      // Addressing:   A
      // Opcode:       4A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=1&A,A=F(A>>1);"

      // "'": LSR (shift right)
      // A byte in memory is shifted right. Flags: N, Z, C
      // The shifted-out bit 0 is saved in C
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      46,  56,   4E,  5E
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "p=r(a),C=1&p,w(a,F(p>>1)),c++;"

      // "(": DEX (decrement X)
      // X is decremented. Flags: N, Z
      // Addressing:   imp
      // Opcode:       CA
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "X=F(X-1);"

      // ")": BIT (test bits in memory)
      // N and V = bits 7 and 6 of operand. Z is set if operand AND A is not zero. Flags: N, Z, V
      // Addressings:  zpg, abs
      // Opcodes:      24,   2C
      // Cycles total: 3,    4
      // Cycles addr.: 0,    1
      // Cycles opc. : 1,    1
      + "p=r(a),F(p&A),N=p>>7&1,V=p>>6&1;"

      // "*": ROR A (rotate right accumulator)
      // Rotate right A. Same as right shift but C flag is put into bit 7. Flags: N, Z, C
      // The shifted-out bit 0 is saved in C
      // Addressing:   A
      // Opcode:       6A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=1&A,A=F((A>>1)+128*(1&P));"

      // "+": INC (increment memory)
      // A byte in memory is incremented. Flags: N, Z
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      E6,  F6,   EE,  FE
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "w(a,F(r(a)+1)),c++;"

      // ",": INX (increment X)
      // X is incremented. Flags: N, Z
      // Addressing:   imp
      // Opcode:       E8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "X=F(X+1);"

      // "-": DEY (decrement Y)
      // Y is decremented. Flags: N, Z
      // Addressing:   imp
      // Opcode:       88
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "Y=F(Y-1);"

      // ".": INY (increment Y)
      // Y is incremented. Flags: N, Z
      // Addressing:   imp
      // Opcode:       C8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "Y=F(Y+1);"

      // "/": LDY (load Y with memory)
      // Y = a byte from memory. Flags: N, Z
      // Addressings:  imm, zpg, zpgX, abs, absX
      // Opcodes:      A0,  A4,  B4,   AC,  BC
      // Cycles total: 2,   3,   4,    4,   4*
      // Cycles addr.: -1,  0,   1,    1,   1*
      // Cycles opc. : 1,   1,   1,    1,   1
      + "Y=F(r(a));"

      // 0: ROR (rotate right)
      // Rotate right a byte in memory. Same as left shift but C flag is put into bit 7. Flags: N, Z, C
      // The shifted-out bit 0 is saved in C
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      66,  76,   6E,  7E
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "p=r(a),C=1&p,w(a,F((p>>1)+128*(1&P))),c++;"

      // "1": CLC (clear carry flag)
      // C is set to 0
      // Addressing:   imp
      // Opcode:       18
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=0;"

      // "2": SEI (set interrupt disable flag)
      // I is set to 1
      // Addressing:   imp
      // Opcode:       78
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "I=1;"

      // "3": CLD (clear decimal flag)
      // D is set to 0
      // Addressing:   imp
      // Opcode:       D8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "D=0;"

      // "4": CLI (clear interrupt disable flag)
      // I is set to 0
      // Addressing:   imp
      // Opcode:       58
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "I=0;"

      // "5": LDA (load accumulator with memory)
      // A = a byte from memory. Flags: N, Z
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      A9,  A5,  B5,   AD,  BD,   B9,   A1,   B1
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "A=F(r(a));"

      // "6": AND: (AND memory and accumulator)
      // A = A AND a byte in memory. Flags: N, Z
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      29,  25,  35,   2D,  3D,   39,   21,   31
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "A=F(r(a)&A);"
      
      // "7": CMP (compare memory and accumulator)
      // N, Z and C are set with the result of A - a byte in memory
      // Flag C is set if there's no borrow
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      C9,  C5,  D5,   CD,  DD,   D9,   C1,   D1
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "p=r(a),C=A-p>=0,F(A-p);"

      // "8": SBC (subtract from accumulator with carry)
      // A = A - a byte from memory - (1 - Carry). Flags: N, Z, C, V
      // Flag C is set if there's no borrow
      // Flag V is set if the subtraction is incorrectly considered positive
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      E9,  E5,  F5,   ED,  FD,   F9,   E1,   F1
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "p=r(a),t=A+C-1-p,V=!!(128&(A^p))&&!!(128&(A^t)),C=t>=0,A=F(t);"

      // "9": ADC (add to accumulator with carry)
      // A = A + a byte in memory + Carry. Flags: N, Z, C, V
      // Flag C is set if there's a carry
      // Flag V is set if the sum of two positive numbers is incorrectly considered negative
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      69,  65,  75,   6D,  7D,   79,   61,   71
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "p=r(a),t=A+C+p,V=!(128&(A^p))&&!!(128&(A^t)),C=t>255,A=F(t);"
      
      // ":": BCS (branch on carry set)
      // PC = address if C is 1
      // Addressing:   rel 
      // Opcode:       B0
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "C&&(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // ";": BMI (branch on minus)
      // PC = address if N is 1
      // Addressing:   rel 
      // Opcode:       30
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "N&&(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "<": BEQ (branch if equal)
      // PC = address if Z is 0
      // Addressing:   rel 
      // Opcode:       F0
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "Z&&(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "=": BPL (branch on plus)
      // PC = address if N is 0
      // Addressing:   rel 
      // Opcode:       10
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "N||(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // ">": BVS (branch on overflow set)
      // PC = address if V is 1
      // Addressing:   rel 
      // Opcode:       70
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "V&&(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "?": BNE (branch if not equal)
      // PC = address if Z is 1
      // Addressing:   rel 
      // Opcode:       D0
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "Z||(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "@": BVC (branch on overflow clear)
      // PC = address if V is 0
      // Addressing:   rel 
      // Opcode:       50
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "V||(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "A": LDX (load X with memory)
      // X = a byte from memory. Flags: N, Z
      // Addressings:  imm, zpg, zpgY, abs, absY
      // Opcodes:      A2,  A6,  B6,   AE,  BE
      // Cycles total: 2,   3,   4,    4,   4*
      // Cycles addr.: -1,  0,   1,    1,   1*
      // Cycles opc. : 1,   1,   1,    1,   1
      + "X=F(r(a));"
      
      // "B": EOR (exclusive-or memory and accumulator)
      // A = A XOR a byte in memory. Flags: N, Z
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      49,  45,  55,   4D,  5D,   59,   41,   51
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "A=F(r(a)^A);"
      
      // "C": DEC (decrement memory)
      // A byte in memory is decremented. Flags: N, Z
      // Addressings:  zpg, zpgX, abs, absX
      // Opcodes:      C6,  D6,   CE,  DE
      // Cycles total: 5,   6,    6,   7
      // Cycles addr.: 0,   1,    1,   2
      // Cycles opc. : 3,   3,    3,   3 (***)
      + "w(a,F((r(a)-1)&255)),c++;"
      
      // "D": ASL A (shift left accumulator)
      // A is left shifted. Flags: N, Z, C
      // The shifted-out bit 7 is saved in C
      // Addressing:   A
      // Opcode:       0A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=A>>7,A=F(2*A);"
      
      // "E": JSR (jump to subroutine)
      // Push PC + 2, PC = absolute address
      // Addressing:   abs
      // Opcode:       20
      // Cycles total: 6
      // Cycles addr.: 1
      // Cycles opc. : 3 (***)
      + "h(PC>>8),h(255&PC),PC=a-1,c++;"
      
      // "F": SEC (set carry flag)
      // C is set to 1
      // Addressing:   imp
      // Opcode:       38
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "C=1;"
      
      // "G": SED (set decomal flag)
      // D is set to 1
      // Addressing:   imp
      // Opcode:       F8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "D=1;"
      
      // "H": CLV (clear overflow flag)
      // V is set to 0
      // Addressing:   imp
      // Opcode:       B8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "V=0;"
      
      // "I": ORA (OR memory and accumulator)
      // A = A OR a byte in memory. Flags: N, Z. 
      // Addressings:  imm, zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      09,  05,  15,   0D,  1D,   19,   01,   11
      // Cycles total: 2,   3,   4,    4,   4*,   4*,   6,    5*
      // Cycles addr.: -1,  0,   1,    1,   1*,   1*    3,    3*
      // Cycles opc. : 1,   1,   1,    1,   1,    1,    1,    1
      + "A=F(r(a)|A);"
      
      // "J": PHA (push accumulator)
      // Push A
      // Addressing:   imp
      // Opcode:       48
      // Cycles total: 3
      // Cycles addr.: 0
      // Cycles opc. : 1
      + "h(A);"
      
      // "K": PHP (push processor status)
      // Push P with B flag set to 1
      // Addressing:   imp
      // Opcode:       08
      // Cycles total: 3
      // Cycles addr.: 0
      // Cycles opc. : 1
      + "h(P|16);"
      
      // "L": PLA (pull accumulator)
      // Pull A. Flags: N, Z.
      // Addressing:   imp
      // Opcode:       68
      // Cycles total: 4 (*** 1 extra cycle according to nestest)
      // Cycles addr.: 0
      // Cycles opc. : 1
      + "A=F(g()),c++;"
      
      // "M": PLP (pull processor status)
      // Pull P and set all flags
      // (According to nestest, the B flag stays at 0) 
      // Addressing:   imp
      // Opcode:       28
      // Cycles total: 4 (*** 1 extra cycle according to nestest)
      // Cycles addr.: 0
      // Cycles opc. : 1
      + "f(g()&239),c++;"
      
      // "N": RTI (return from interrupt)
      // Pull P, set all flags, pull PC
      // Addressing:   imp
      // Opcode:       40
      // Cycles total: 6
      // Cycles addr.: 0
      // Cycles opc. : 4 (***)
      + "f(g()),PC=g()+256*g()-1,c++;"
      
      // "O": BCC (branch on carry clear)
      // PC = address if C is 0
      // Addressing:   rel 
      // Opcode:       90
      // Cycles total: 2**
      // Cycles addr.: 0
      // Cycles opc. : 0**
      + "C||(c+=1+(a>>8!=PC+1>>8),PC=a);"
      
      // "P": BRK (force break)
      // Interrupt, push PC+2 (PC+1 is a padding byte), push P with B flag set to 1, set I to 1
      // This is equivalent to an IRQ interrupt with another value of P pushed on the stack:
      // "h(PC>>8),h(255&PC),h(P|16),I=1,PC=r(65534)+256*r(65535)-1;"
      // Addressing:   imp
      // Opcode:       00
      // Cycles total: 7
      // Cycles addr.: 0
      // Cycles opc. : 5
      //+ 
      + "op(3,1);"
      
      // "Q": TAY (transfer accumulator to Y)
      // Y = A. Flags: N, Z
      // Addressing:   imp
      // Opcode:       A8
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "Y=F(A);"
      
      // "R": STA (store accumulator)
      // A is copied in memory
      // Addressings:  zpg, zpgX, abs, absX, absY, indX, indY
      // Opcodes:      85,  95,   8D,  9D,   99,   81,   91
      // Cycles total: 3,   4,    4,   5,    5,    6,    6
      // Cycles addr.: 0,   1,    1,   2,    2     3,    2
      // Cycles opc. : 1,   1,    1,   1,    1,    1,    1
      + "w(a,A);"
      
      // "S": STX (store X)
      // X is copied in memory
      // Addressings:  zpg, zpgY, abs
      // Opcodes:      86,  96,   8E
      // Cycles total: 3,   4,    4
      // Cycles addr.: 0,   1,    1
      // Cycles opc. : 1,   1,    1
      + "w(a,X);"
      
      // "T": TSX (transfer stack pointer to X)
      // X = S. Flags: N, Z
      // Addressing:   imp
      // Opcode:       BA
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "X=F(S);"
      
      // "U": TAX (transfer accumulator to X)
      // X = A. Flags: N, Z
      // Addressing:   imp
      // Opcode:       AA
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "X=F(A);"
      
      // "V": STY (store Y)
      // Y is copied in memory
      // Addressings:  zpg, zpgX, abs
      // Opcodes:      84,  94,   8C
      // Cycles total: 3,   4,    4
      // Cycles addr.: 0,   1,    1
      // Cycles opc. : 1,   1,    1
      + "w(a,Y);"
      
      // "W": TYA (transfer Y to accumulator)
      // A = Y. Flags: N, Z
      // Addressing:   imp
      // Opcode:       98
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "A=F(Y);"
      
      // "X": TXA (transfer X to accumulator)
      // A = X. Flags: N, Z
      // Addressing:   imp
      // Opcode:       8A
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + "A=F(X);"
      
      // "Y": RTS (return from subroutine)
      // Pull and increment PC
      // Addressing:   imp
      // Opcode:       60
      // Cycles total: 6
      // Cycles addr.: 0
      // Cycles opc. : 0 (***)
      + "PC=g()+256*g(c+=2);"
      
      // "Z": JMP (jump to new location)
      // Set a new value to PC
      // Addressings:  abs
      // Opcodes:      4C
      // Cycles total: 3
      // Cycles addr.: 1
      // Cycles opc. : 0
      + "PC=a-1;"
      
      // "[" JMP indirect
      // Jump to an address stored anywhere in memory. The address of this address is stored after the opcode
      // Hardware bug: if the indirect address falls on a page boundary ($xxFF), it will wrap and fetch the low byte in the same page ($xx00)
      // Addressing:   ind
      // Opcodes:      6C
      // Cycles total: 5
      // Cycles addr.: 3
      // Cycles opc. : 2
      + "PC=r(a)+256*r(a+1-256*((a&255)==255))-1"

      // "z": NOP (no operation)
      // (When a "z" is read, the generated JavaScript code will just contain "undefined;")
      // Addressing:   imp
      // Opcode:       EA
      // Cycles total: 2
      // Cycles addr.: 0
      // Cycles opc. : 0
      + ""

    // Make an array from this string
    ).split(";")

    // Fetch the right instruction for the current opcode (ignore every illegal opcode where o % 4 == 3):
    // (The string below is optomized for compression: all the illegal opcodes are assigned characters that allow extra repetition)
    [
       (
         `PI#PI#KIDPI#=I#PI#1IDPI#`
        +`E6%)6%M6$)6%;6%E6%F6%E6%`
        +`NB'NB'JB&ZB'@B'NB'4B'NB'`
        +`Y90Y90L9*[90>90Y90290Y90`
        +`VRSVRS-zXVRSORSVRSWR VRS`
        +`/5A/5AQ5U/5A:5A/5AH5T/5A`
        +`"7C"7C.7("7C?7C"7C37C"7C`
        +`!8+!8+,8z!8+<8+!8+G8+!8+`
      )[o - (o >> 2)].charCodeAt() - 32
    ]
  )
);

// Emulation
// ---------

// If an interrupt (v = 1/2/3) is specified, it's executed
// Otherwise, execute the next opcode at the address pointed by the PC register
// z means BRK opcode (similar to IRQ, but with a slightly different P pushed on the stack)
op = (v, z) => (

  // - Reset cycle counter
  // - Fetch opcode at address PC (costs 1 cycle), save it in o
  // - Increment PC, save it in a
  // - Fetch the byte at address a (costs 1 cycle), save it in p
  c = 0,
  o = r(PC),
  p = r(a = PC+1),

  // Execute an interrupt if v is set
  v ? (

    // 1: NMI:
    // Push PC and P with B flag set to 0, then set I to 1,
    // then jump to address stored at $FFFA-$FFFB
    // This costs 7 cycles
    // On NES, it is triggered at the beginning of VBlank if bit 7 of PPU register $2000 is set, otherwise it's skipped and only costs 2 cycles

    // 2: Reset:
    // Push PC and P with B flag set to 0, then set I to 1,
    // then jump to address stored at $FFFC-$FFFD
    // This resets c and costs 8 cycles
    // On NES, this also resets the PPU

    // 3: IRQ/BRK:
    // Push PC and P with B flag set to 0 (IRQ) or 1 (BRK), then set I to 1,
    // then jump to address stored at $FFFE-$FFFF
    // This costs 7 cycles

    // Only execute NMI if VBlank (bit 7 of $2000) is set
    (v > 1 || r(0x2000) >> 7)
    
    // Only execute IRQ if I is not set
    && (v < 3 || !I)
    
    && (
      (
        (v - 2) 
        ? (h(PC >> 8), h(255 & PC), h(z ? (P|16) : (239 & P))) // NMI/IRQ/BRK
        : (S = (S-3) & 255) // Reset
      ),

      I = 1,
      PC = r(65528 + v * 2) + 256 * r(65528 + v * 2 + 1)
    )
  )

  // Or execute the next instruction:
  : (
    o && O[o](),
    PC++,
    PC &= 0xFFFF
  ),

  // Update status register P according to the new flags values
  P = C + Z*2 + I*4 + D*8 + B*16 + 32 + V*64 + N*128
)
;

// Audio contexts, oscillators, gains
a1 = a2 = a3 = a4 = a5 = 0;
o1 = o2 = o3 = o4 = o5 = 0;
g1 = g2 = g3 = g4 = g5 = 0;

// Status: DMC/frame interrupt + enabled DMC/noise/triangle/pulse 2/pulse 1 channels
apu_status = {I: 0, F:0, P1: 0, P2: 0, T:0, N:0, D:0}

apu_reset = () => {
  if(!a2) a2 = new AudioContext();
  if(!a3) a3 = new AudioContext();
  if(!a4) a4 = new AudioContext();
  if(!a5) a5 = new AudioContext();

  if(o1) o1.stop();
  if(o2) o2.stop();
  if(o3) o3.stop();
  if(o4) o4.stop();
  if(o5) o5.stop();
  
  // Pulse 1
  pulse1timer = 0;
  pulse1volume = 0;
  if(!a1) a1 = new AudioContext();
  o1 = new OscillatorNode(a1, {type: "square", frequency: 0});
  g1 = new GainNode(a1, {gain: 0.1});
  o1.connect(g1).connect(a1.destination);
  o1.start();
  
  // Pulse 2
  pulse2timer = 0;
  pulse2volume = 0;
  if(!a2) a2 = new AudioContext();
  o2 = new OscillatorNode(a2, {type: "square", frequency: 0});
  g2 = new GainNode(a2, {gain: 0.1});
  o2.connect(g2).connect(a2.destination);
  o2.start();

  // Triangle
  triangletimer = 0;
  if(!a3) a3 = new AudioContext();
  o3 = new OscillatorNode(a3, {type: "triangle", frequency: 0});
  g3 = new GainNode(a3, {gain: 0.1});
  o3.connect(g3).connect(a3.destination);
  o3.start();

  // Noise
  noisetimer = 0;
  noisevolume = 0;
  if(!a4) a4 = new AudioContext();
  o4 = new OscillatorNode(a4, {frequency: 0});
  real = new Float32Array(128);
  imag = new Float32Array(128);
  for(var i = 128; i--;){
    real[i] = 3;
    imag[i] = -Math.random()/3;
  }
  wave = a4.createPeriodicWave(real, imag, { disableNormalization: true });
  o4.setPeriodicWave(wave)
  g4 = new GainNode(a4, {gain: 0.003 * 15});
  o4.connect(g4).connect(a4.destination);
  o4.start();
}

// 4015: Status register (read/write)
get_4015 = () => {
  //console.log("get 4015");
  return apu_status.P1 + apu_status.P2 << 1 + apu_status.T << 2 + apu_status.N << 3 + apu_status.D << 4 + apu_status.F <<6 + apu_status.I << 7;
}

set_4015 = (value) => {
  //console.log("set 4015");
  apu_status.P1 = value & 1;
  apu_status.P2 = (value >> 1) & 0b1;
  apu_status.T = (value >> 2) & 0b1;
  apu_status.N = (value >> 3) & 0b1;
  apu_status.D1 = (value >> 4) & 0b1;
}
